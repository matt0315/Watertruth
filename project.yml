name: Watertruth
options:
  bundleIdPrefix: studio.botland
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "8KV5SRG3UC"
targets:
  Watertruth:
    type: application
    platform: iOS
    sources:
      - path: Watertruth
        excludes:
          - "**/*.md"
      - path: Watertruth/Resources
        buildPhase: resources
    info:
      path: Watertruth/Info.plist
      properties:
        CFBundleDisplayName: Watertruth
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "6"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSPhotoLibraryUsageDescription: "Watertruth accesses your photo library so you can attach cover and progress photos to plants and care events. Photos stay on-device for your journal."
        NSCameraUsageDescription: "Watertruth uses the camera so you can capture soil-check and plant progress photos for your journal — never for plant identification or disease scanning."
        NSUserNotificationsUsageDescription: "Watertruth sends soil-check reminders so you water at the right time."
    entitlements:
      path: Watertruth/Watertruth.entitlements
      properties:
        com.apple.security.application-groups:
          - group.studio.botland.watertruth
    dependencies:
      - target: WatertruthWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.watertruth
        INFOPLIST_FILE: Watertruth/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watertruth/Watertruth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"

  WatertruthWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WatertruthWidget
    info:
      path: WatertruthWidget/Info.plist
      properties:
        CFBundleDisplayName: Watertruth Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatertruthWidget/WatertruthWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.studio.botland.watertruth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.watertruth.widget
        INFOPLIST_FILE: WatertruthWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatertruthWidget/WatertruthWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"

  WatertruthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WatertruthTests
    dependencies:
      - target: Watertruth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.watertruth.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Watertruth.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Watertruth"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Watertruth:
    build:
      targets:
        Watertruth: all
        WatertruthWidget: all
        WatertruthTests: [test]
    test:
      targets:
        - WatertruthTests
    run:
      config: Debug
